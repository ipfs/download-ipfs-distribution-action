name: 'Download IPFS Distribution'
description: 'Download an IPFS distribution from GitHub releases'
inputs:
  name:
    description: 'Name of the distribution to download'
    required: true
    default: 'kubo'
  version:
    description: 'Version of the distribution to download (defaults to the latest stable, non-draft release that ships a verifiable binary)'
    required: false
  github-repo:
    description: "GitHub owner/repo that hosts the release binaries (overrides the built-in distributions.json map; set it for distributions not in the map or to use a mirror)"
    required: false
  github-token:
    description: "GitHub token used to read release metadata and assets (defaults to github.token; pass a token with Contents: read for a private repository)"
    required: false
  working-directory:
    description: "Directory where the action is going to be performed (defaults to temp directory)"
    required: false
  install-directory:
    description: "Directory where the executable is going to be copied (defaults to /usr/local/bin or /usr/bin on windows)"
    required: false
  cache:
    description: "A boolean value to indicate whether the resolved archive should be cached and restored before downloading"
    required: false
    default: 'true'
  prefix:
    description: "Prefix to be used for the cache key (defaults to download-ipfs-distribution-action)"
    required: false
    default: 'download-ipfs-distribution-action'
outputs:
  executable:
    description: "The name of the executable"
    value: ${{ steps.copy.outputs.executable }}
  executables:
    description: "The names of all the executables"
    value: ${{ steps.copy.outputs.executables }}
  cache-hit:
    description: "A boolean value to indicate the archive was restored from cache instead of downloaded"
    value: ${{ steps.cache-restore.outputs.cache-hit == 'true' }}
runs:
  using: "composite"
  steps:
    - id: system
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        OS="$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')"
        ARCH="$(echo "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
        if [ -z "$WORKING_DIRECTORY" ]; then
          WORKING_DIRECTORY="$RUNNER_TEMP"
        fi
        case "$WORKING_DIRECTORY" in
          *$'\n'*|*$'\r'*) echo "::error::working-directory must not contain newlines"; exit 1 ;;
        esac
        mkdir -p "$WORKING_DIRECTORY"
        case "$OS" in
          macos) OS="darwin" ;;
        esac
        case "$ARCH" in
          x86) ARCH="386" ;;
          x64) ARCH="amd64" ;;
        esac
        echo "working-directory=$WORKING_DIRECTORY"
        echo "os=$OS"
        echo "arch=$ARCH"
        {
          echo "working-directory=$WORKING_DIRECTORY"
          echo "os=$OS"
          echo "arch=$ARCH"
        } >> "$GITHUB_OUTPUT"
      shell: bash
    - id: prepare
      env:
        NAME: ${{ inputs.name }}
      run: |
        if ! [[ "$NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
          echo "::error::name must start with an alphanumeric character and contain only letters, numbers, dots, underscores, or hyphens"
          exit 1
        fi
        mkdir -p "$NAME"
      shell: bash
      working-directory: ${{ steps.system.outputs.working-directory }}
    # Resolve the GitHub repo, the concrete version, the release asset URL, its checksum,
    # and the immutable cache key.
    - id: resolve
      env:
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
        NAME: ${{ inputs.name }}
        VERSION: ${{ inputs.version }}
        GITHUB_REPO: ${{ inputs.github-repo }}
        INSTALL_DIRECTORY: ${{ inputs.install-directory }}
        OS: ${{ steps.system.outputs.os }}
        ARCH: ${{ steps.system.outputs.arch }}
        PREFIX: ${{ inputs.prefix }}
      run: |
        source "$GITHUB_ACTION_PATH/scripts/resolve-release.sh"
      shell: bash
      working-directory: ${{ steps.system.outputs.working-directory }}
    # Cache-first: restore the immutable artifact before any download. A hit skips the
    # download; the archive is still re-verified by the verify step below.
    - id: cache-restore
      if: inputs.cache == 'true'
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.system.outputs.working-directory }}/${{ steps.resolve.outputs.archive }}
        key: ${{ steps.resolve.outputs.cache-key }}
      continue-on-error: true
    - id: download
      if: inputs.cache != 'true' || steps.cache-restore.outputs.cache-hit != 'true'
      env:
        ARCHIVE: ${{ steps.resolve.outputs.archive }}
        ASSET_API_URL: ${{ steps.resolve.outputs.asset-api-url }}
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
      run: |
        source "$GITHUB_ACTION_PATH/scripts/download-asset.sh"
      shell: bash
      working-directory: ${{ steps.system.outputs.working-directory }}
    # Verify on every run, including a cache hit, so a corrupt download or a tampered
    # cache entry is caught. A missing or mismatched checksum fails the action.
    - env:
        ARCHIVE: ${{ steps.resolve.outputs.archive }}
        CHECKSUM: ${{ steps.resolve.outputs.checksum }}
      run: |
        if [ "$RUNNER_OS" = "macOS" ]; then
          echo "$CHECKSUM  $ARCHIVE" | shasum --algorithm 256 --check
        else
          echo "$CHECKSUM  $ARCHIVE" | sha256sum --check
        fi
      shell: bash
      working-directory: ${{ steps.system.outputs.working-directory }}
    - if: inputs.cache == 'true' && steps.cache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ steps.system.outputs.working-directory }}/${{ steps.resolve.outputs.archive }}
        key: ${{ steps.resolve.outputs.cache-key }}
      continue-on-error: true
    - env:
        ARCHIVE: ${{ steps.resolve.outputs.archive }}
        NAME: ${{ inputs.name }}
      run: |
        case "$ARCHIVE" in
          *.tar.gz) tar -zxf "$ARCHIVE" ;;
          *.zip) 7z e "$ARCHIVE" -o"$NAME" ;;
          *) echo "::error::unsupported archive format: $ARCHIVE"; exit 1 ;;
        esac
      shell: bash
      working-directory: ${{ steps.system.outputs.working-directory }}
    - id: copy
      env:
        NAME: ${{ inputs.name }}
        INSTALL_DIRECTORY: ${{ steps.resolve.outputs.install-directory }}
      run: |
        names=()
        while IFS= read -r executable; do
          if [ -w "$INSTALL_DIRECTORY" ]; then
            cp "$executable" "$INSTALL_DIRECTORY/"
          elif command -v sudo >/dev/null; then
            sudo cp "$executable" "$INSTALL_DIRECTORY/"
          else
            echo "::error::cannot install $(basename "$executable") to $INSTALL_DIRECTORY (not writable and sudo unavailable)"
            exit 1
          fi
          names+=("$(basename "$executable")")
        done < <(find "$NAME" -type f -perm -111 ! -name "*.sh")
        if [ "${#names[@]}" -eq 0 ]; then
          echo "::error::no executable found in $NAME after extraction"
          exit 1
        fi
        {
          echo "executable=${names[0]}"
          echo "executables=$(jq -nc '$ARGS.positional' --args "${names[@]}")"
        } >> "$GITHUB_OUTPUT"
        echo "installed ${names[*]} to $INSTALL_DIRECTORY"
      shell: bash
      working-directory: ${{ steps.system.outputs.working-directory }}
    - if: always() && steps.prepare.outcome == 'success'
      env:
        ARCHIVE: ${{ steps.resolve.outputs.archive }}
        NAME: ${{ inputs.name }}
      run: |
        rm -rf "$NAME"
        rm -f "$ARCHIVE"
      shell: bash
      working-directory: ${{ steps.system.outputs.working-directory }}
