name: Test Cache Download
on: [push]
jobs:
  Wait-For-Cache-Upload:
    name: Wait for Cache Upload
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cache Upload
        uses: lewagon/wait-on-check-action@78dd4dd5d9b337c14c3c81f79e53bf7d222435c1 # v1.6.1
        with:
          ref: ${{ github.ref }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 20
          check-regexp: 'Cache Upload \(.*\)'
          allowed-conclusions: success
  Cache-Download:
    needs: Wait-For-Cache-Upload
    name: Cache Download
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
        with:
          path: download-ipfs-distribution-action
      # Permit release metadata requests but reject the octet-stream asset request. A passing
      # run therefore proves that the archive was restored and the download step was skipped.
      - name: Reject release asset downloads
        run: |
          shim="$RUNNER_TEMP/reject-asset-download"
          mkdir -p "$shim"
          real_curl="$(command -v curl)"
          echo "REAL_CURL=$real_curl" >> "$GITHUB_ENV"
          echo "$shim" >> "$GITHUB_PATH"
          cat > "$shim/curl" <<'EOF'
          #!/usr/bin/env bash
          for argument in "$@"; do
            if [ "$argument" = "Accept: application/octet-stream" ]; then
              echo "release asset download was not expected" >&2
              exit 99
            fi
          done
          exec "$REAL_CURL" "$@"
          EOF
          chmod +x "$shim/curl"
        shell: bash
      - id: distribution
        uses: ./download-ipfs-distribution-action
        with:
          name: kubo
          version: v0.42.0
          prefix: test-cache-${{ matrix.os }}
      # The upload job populated the cache, so this run must restore it rather than download.
      - if: ${{ steps.distribution.outputs.cache-hit != 'true' }}
        run: exit 1
        shell: bash
      - run: ${{ steps.distribution.outputs.executable }} --help
        shell: bash
